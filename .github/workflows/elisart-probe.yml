name: elisart-bench
on:
  push:
    branches: ['arena/2cae36fd-fundament-montazh']
    paths: ['tools/elisart-bench.py', '.github/workflows/elisart-probe.yml']
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: bench
        env:
          ELISART_B64: 'c2stZHItbHdGcHlGR3dlNzdybEtkTnR3VEo5X29KR1hxcjIxMl92S1Z6TS04Rg=='
        run: |
          export ELISART_API_KEY="$(printf '%s' "$ELISART_B64" | base64 -d)"
          python3 tools/elisart-bench.py > probe-results.txt 2>&1
          echo "exit: $?"
          tail -c 600 probe-results.txt
      - name: publish
        run: |
          git config user.name "probe-bot"; git config user.email "probe@arena.ai"
          git add -f probe-results.txt
          git commit -m "chore(bench): results [skip ci]" || echo "no changes"
          git push origin HEAD:arena/2cae36fd-fundament-montazh
